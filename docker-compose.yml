services:
  wpp-automation:
    build:
      context: .
      dockerfile: Dockerfile
    image: bemvindo/wpp-automation:prod
    container_name: bemvindo-java
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://stays-db:5432/stays
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "7"
    networks:
      - app-net

networks:
  app-net:
    external: true
