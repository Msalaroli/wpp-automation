server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 50
    connection-timeout: 2s
    accesslog:
      enabled: true
      pattern: '%t %a "%m %U %H" %s %b %Dms'

spring:
  application:
    name: wpp-automation

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 2000

  flyway:
    enabled: true
    schemas: ops
    default-schema: ops
    create-schemas: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: "baseline existing ops schema"
    validate-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    org.springframework: WARN
    org.springframework.jdbc: WARN
    org.flywaydb: WARN
    com.zaxxer.hikari: WARN
    com.apijavaspring: INFO

app:
  meta:
    verify-token: ${META_VERIFY_TOKEN}
    app-secret: ${META_APP_SECRET}
    signature-enabled: ${META_SIGNATURE_ENABLED:false}

  worker:
    enabled: true
    poll-delay-ms: 200
    worker-id: "local-intellij-1"
    threads: 2
    locked-by: "wpp-automation-local"

  commercial:
    allowed-numbers: ${COMMERCIAL_ALLOWED_NUMBERS:}

  chatwoot:
    mirror-inbound-enabled: ${CHATWOOT_MIRROR_INBOUND_ENABLED:true}
